server:
  port: 8083

spring:
  application:
    name: service-stock
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/db_stock?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:J@wss12345/}

  jpa:
    hibernate:
      ddl-auto: update      # Hibernate crée / met à jour les tables à partir des entités
    show-sql: true          # affiche le SQL généré dans la console
    open-in-view: false
